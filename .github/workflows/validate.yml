name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator self-test
        run: python3 scripts/audit.py --selftest
      - name: Audit ledgers
        run: python3 scripts/audit.py
      - name: Ledger is current
        run: python3 scripts/report.py --check