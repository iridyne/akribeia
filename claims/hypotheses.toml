# Local hypotheses. A hypothesis is not a finding. Each one names an experiment, a metric, and a falsifier.

[[claim]]
id = "H-001"
statement = "A model-agnostic closure rule ('after a tool or probe result, the first sentence is a conclusion; never end a turn on raw tool output') reduces premature endings."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "single-user OMP sessions, DeepSeek-class model"
experiment = "EXP-0001"
metric = "premature_endings_per_100"
falsifier = "No >=25% relative reduction after 20 sessions, or a >=20% increase in turns per user message."
notes = "The rule is delivered to main and subagents by APPEND-SYSTEM-one-shot.md and repeated in RULES.md section 4."

[[claim]]
id = "H-002"
statement = "An explicit permission-escalation path for root-only reads reduces eval file-read violations more than a prohibition alone."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "remote diagnostics over SSH"
experiment = "EXP-0002"
metric = "eval_file_reads_per_100"
falsifier = "No >=25% relative reduction after 20 sessions, or the same violation recurs with a sanctioned path available."
notes = "A prohibition without a legitimate alternative is a harness gap, not a model defect."

[[claim]]
id = "H-003"
statement = "Delivering a shared rule to main and subagents (target: *) improves adherence compared with delivering it only to the main session."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "subagent traces"
experiment = "EXP-0003"
metric = "subagent_rule_violations_per_100"
falsifier = "No measurable difference between the two delivery targets after 30 subagent runs."
notes = "Cannot be tested across models in this single-model setup; only delivery targets can be ablated."

[[claim]]
id = "H-004"
statement = "For interactive guardrails, deterministic checks beat LLM judges on latency and one-shot completion; LLM judges belong in the weekly batch lane."
status = "hypothesis"
confidence = "medium"
source = "local + LIT-004"
scope = "interactive tool routing"
experiment = "EXP-0004"
metric = "guardrail_latency_p95, false_block_rate, one_shot_rate"
falsifier = "A judge lane that improves one-shot rate without increasing p95 latency by more than 1 second."
notes = "Operational constraint D-002 is the current default; this hypothesis tests it."

[[claim]]
id = "H-005"
statement = "A weekly batch review catches regressions with acceptable lag and less noise than per-turn review."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "one user, 20-60 sessions per week"
experiment = "EXP-0005"
metric = "regression_detection_lag, false_alarm_rate"
falsifier = "A regression survives more than two weekly cycles, or more than half of flagged regressions are false alarms."
notes = "Lag is measured from the first occurrence to the report that names it."

[[claim]]
id = "H-006"
statement = "For this model class, a rule-layer edit has higher leverage per token than an extension-code change."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "DeepSeek-class model with deterministic extensions"
experiment = "EXP-0006"
metric = "effect_size_per_1k_prompt_tokens"
falsifier = "Extension changes show a larger median effect at equal token cost across five interventions."
notes = "Effect size is the relative change in the target metric; token cost includes the delta sent per prompt."

[[claim]]
id = "H-007"
statement = "The isolation nudge must treat the local writer roles (task, sonic, hard-task) as writers, or concurrent writes go unreminded."
status = "hypothesis"
confidence = "medium"
source = "local"
scope = "OMP subagent roles"
experiment = "EXP-0007"
metric = "unreminded_concurrent_writes"
falsifier = "No concurrent-write event in 30 days, or the nudge fires on read-only roles."
notes = "The upstream regex only covered task:*; the local fork added sonic and hard-task."

[[claim]]
id = "H-008"
statement = "Keeping the native bash interceptor alongside the pty lane reduces routing violations without blocking legitimate commands."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "local OMP configuration"
experiment = "EXP-0008"
metric = "policy_hit_rate, false_block_rate, tool_error_rate"
falsifier = "False blocks rise above 2% of calls, or the interceptor catches nothing the pty lane misses in 30 days."
notes = "Upstream disables the interceptor under the heuristic detector; this fork deliberately diverges."

[[claim]]
id = "H-009"
statement = "Wording-level prompt replacements that remove a specific ambiguity reduce the corresponding misread without side effects."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "OMP system-prompt edits"
experiment = "EXP-0009"
metric = "targeted_misread_rate"
falsifier = "The misread persists at the same rate after the replacement, or a new misread appears in the same passage."
notes = "Examples: ground-truth rerun wording, allocation wording, xd:// device call wording."

[[claim]]
id = "H-010"
statement = "A local long-term memory improves recall-dependent tasks without polluting the working context."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "mnemon-backed memory"
experiment = "EXP-0010"
metric = "recall_precision, context_tokens_per_session, repeated_question_rate"
falsifier = "Recall precision below 50%, or context tokens rise without a reduction in repeated questions."
notes = "Memory trust is re-established at retrieval (LIT-012); stale facts are replaced, not appended."

[[claim]]
id = "H-011"
statement = "A control-first gate before reporting headline metrics reduces premature conclusions in research sessions."
status = "hypothesis"
confidence = "low"
source = "local"
scope = "backtest and experiment reporting"
experiment = "EXP-0013"
metric = "premature_metric_conclusions_per_100"
falsifier = "No reduction after 10 research reports, or the gate adds more than one turn to every report."
notes = "INC-0003 is the motivating case: headline metrics were reported before the control run."

[[claim]]
id = "H-012"
statement = "Delivering the edited system prompt itself at every prompt improves rule adherence over a reminder that quotes each edit."
status = "hypothesis"
confidence = "low"
source = "local + upstream changelog"
scope = "OMP system-prompt replacement"
experiment = "EXP-0014"
metric = "rule_adherence_rate, prompt_cache_hit_rate"
falsifier = "Adherence shows no improvement, or cache hit rate drops by more than 10 points."
notes = "The reminder asked the model to apply edits to text it also had to locate; the direct edit removes that step."

[[claim]]
id = "H-013"
statement = "A deterministic payload gate at the start of the weekly job detects a mapped rule that is missing from the provider payload, so no weekly cycle measures an undelivered intervention."
status = "hypothesis"
confidence = "low"
source = "local + INC-0005"
scope = "weekly batch lane, single machine"
experiment = "EXP-0015"
metric = "undetected_delivery_lapses"
falsifier = "A delivery lapse reaches the metrics step without the gate failing, or the gate fails while every assertion is true."
notes = "The probe already exists (adapters/omp/prompt-assert.ts); the change runs it as a gate. It cannot detect a rule that no assertion covers."

[[claim]]
id = "H-014"
statement = "Under AR(1) serial dependence (rho >= 0.5), naive before/after harness comparisons inflate Type I false positives above 25%, whereas randomized alternating paired permutation tests keep false positives near nominal 5% while improving power at N >= 40."
status = "supported"
confidence = "high"
source = "local simulation (EXP-0016) + docs/prior-art.md"
scope = "AR(1) stationary Gaussian process, N in {20, 40, 80}, effect = 0.5 SD"
experiment = "EXP-0016"
metric = "type1_fp_rate, power"
falsifier = "Rand-Alt Perm exceeds 10% Type I error at rho=0.7, or Before/After stays below 10% Type I error."
notes = "Verified via scripts/nof1_power.py --seed 42 --trials 1000 (reports/2026-11-24-nof1-power-study.md)."

[[claim]]
id = "H-016"
statement = "Human-agent friction is measurable from session traces: repair turns per completed session, computed from a text heuristic, agrees with the human's own re-steer labels closely enough to steer experiments."
status = "hypothesis"
confidence = "low"
source = "local + docs/program.md"
scope = "single-user OMP sessions, one model"
experiment = "EXP-0018"
metric = "repair_turn_precision, repair_turn_recall, spearman_vs_human_labels"
falsifier = "Spearman agreement below 0.7 on 20 labeled sessions, or the heuristic cannot label at least 80% of sessions."
notes = "A heuristic may draft labels; promotion of any harness claim that depends on it needs the calibrated metric (docs/method.md section 3). Until then, tool error rate is the only friction number this project reports."

[[claim]]
id = "H-015"
statement = "Requiring every negative wire-payload assertion to declare a positive witness assertion (requires_witness) prevents vacuous passes when the guarded extension fails to load (INC-0006)."
status = "supported"
confidence = "high"
source = "local oracle verification (EXP-0017) + INC-0006"
scope = "deterministic wire-payload contracts (OpenAI, Anthropic, OMP)"
experiment = "EXP-0017"
metric = "vacuous_pass_rate, schema_rejection_rate"
falsifier = "A negative-only contract is accepted by payload_gate.py, or a negative assertion passes while its positive witness fails."
notes = "Verified by scripts/payload_gate.py --selftest and tests/test_akribeia.py."
