[[experiment]]
id = "EXP-0011"
title = "ABAB ablation of the rendered closure rule"
status = "planned"
hypothesis = "H-001"
intervention = "M-003"
design = "ABAB with 7-day phases and a seeded, run-constrained order; RULES.md stays constant; toggle only the fragment's enabled flag."
metric = "premature_endings_per_100"
baseline = "fragment off in the A phases"
sample = "20 sessions per phase pair"
falsifier = "The on/off difference is smaller than the phase-to-phase variation, or the conclusion shape metric shows no change."
stop_rule = "Stop after two ABAB cycles or when a phase has fewer than 5 sessions."
confounds = "Remote-diagnosis frequency; model alias changes; other rules edited mid-cycle."
power = "20 sessions per phase; serial dependence reduces effective n. Treat a single cycle as a lead, not proof."
started = ""
result = ""

[[experiment]]
id = "EXP-0012"
title = "Calibrating the weekly reviewer against human labels"
status = "planned"
hypothesis = "H-005"
intervention = "Weekly reviewer"
design = "Human-label 20 incidents; the reviewer labels the same set blind; compute Cohen's kappa and per-class agreement."
metric = "judge_human_kappa, coverage, false_failure_rate"
baseline = "uncalibrated reviewer"
sample = "20 incidents, re-run each quarter"
falsifier = "Kappa below 0.6, or the reviewer's flags miss more than 30% of human-flagged failures."
stop_rule = "Stop after 20 labels; recalibrate the rubric and repeat once."
confounds = "Criteria drift; label ambiguity; reviewer model changes."
power = "20 labels is enough for a coarse agreement check, not for a precise estimate."
started = ""
result = ""

