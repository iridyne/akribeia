# Preregistered experiments. One variable per experiment.
# status: planned | running | complete | stopped

[[experiment]]
id = "EXP-0001"
title = "Does a model-agnostic closure rule reduce premature endings?"
status = "running"
hypothesis = "H-001"
intervention = "M-002, M-003"
design = "Before/after on real sessions, with the rule delivered to main and subagents. Weekly recomputation."
metric = "premature_endings_per_100"
baseline = "to measure over the 30 days before 2026-11-20"
sample = "20 sessions minimum"
falsifier = "No >=25% relative reduction, or turns per user message rises >=20%."
stop_rule = "At 20 sessions, promote or refute. At 40 sessions with no direction, stop."
confounds = "Task mix, model alias changes, other rule edits shipped the same week."
started = "2026-11-20"
result = ""

[[experiment]]
id = "EXP-0002"
title = "Does a sanctioned permission path reduce eval file reads?"
status = "running"
hypothesis = "H-002"
intervention = "M-001"
design = "Before/after count of eval calls whose code reads or lists files, with a note on whether the target was root-only."
metric = "eval_file_reads_per_100"
baseline = "to measure over the 30 days before 2026-11-20"
sample = "20 sessions minimum"
falsifier = "No >=25% relative reduction, or the same violation recurs while a sanctioned path is available."
stop_rule = "At 20 sessions, promote or refute. If root-only reads are absent from the sample, extend to 40 sessions."
confounds = "Remote-diagnosis frequency; whether the rule is retrieved before the tool call."
started = "2026-11-20"
result = ""

[[experiment]]
id = "EXP-0003"
title = "Main-only versus main-and-subagent rule delivery"
status = "planned"
hypothesis = "H-003"
intervention = "M-003"
design = "A/B delivery target over subagent runs; the rule text and model are fixed."
metric = "subagent_rule_violations_per_100"
baseline = "to measure with target: main only"
sample = "30 subagent runs per arm"
falsifier = "No measurable difference between arms."
stop_rule = "Stop after 30 runs per arm or when the trace does not expose the rule text."
confounds = "Subagent task type; orchestration differences."
started = ""
result = ""

[[experiment]]
id = "EXP-0004"
title = "Deterministic guardrails versus an interactive LLM judge"
status = "planned"
hypothesis = "H-004"
intervention = "Current deterministic guardrails"
design = "Compare a single judge lane against the deterministic lane on identical traffic; measure latency and false blocks."
metric = "guardrail_latency_p95, false_block_rate, one_shot_rate"
baseline = "deterministic lane"
sample = "50 guarded calls per arm"
falsifier = "The judge lane improves one-shot rate without a >1s p95 latency increase."
stop_rule = "Stop on a provider 403 or a >3s p95 latency."
confounds = "Judge model choice; prompt drift; cache warmth."
started = ""
result = ""

[[experiment]]
id = "EXP-0005"
title = "Weekly batch review lag and false-alarm rate"
status = "planned"
hypothesis = "H-005"
intervention = "Weekly review cadence"
design = "Seed or wait for regressions; measure the time from first occurrence to the report that names it."
metric = "regression_detection_lag, false_alarm_rate"
baseline = "per-turn review (simulated on the same traces)"
sample = "8 weekly cycles"
falsifier = "A regression survives more than two cycles, or more than half of flags are false alarms."
